name: PR Check

# Reusable syntax checks. Native checks calls this workflow and reports the
# required `sanity` gate only after syntax, Python, and Swift all pass.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: |
          mapfile -d '' -t pyf < <(find . -path ./.git -prune -o -name '*.py' -print0)
          if [ "${#pyf[@]}" -gt 0 ]; then
            python -m py_compile "${pyf[@]}"
            echo "checked ${#pyf[@]} Python file(s)"
          else
            echo "no Python files"
          fi
      - name: Shell syntax
        run: |
          mapfile -d '' -t shf < <(find . -path ./.git -prune -o -name '*.sh' -print0)
          if [ "${#shf[@]}" -gt 0 ]; then
            for f in "${shf[@]}"; do bash -n "$f"; done
            echo "checked ${#shf[@]} shell file(s)"
          else
            echo "no shell files"
          fi
      - name: JSON validity
        run: |
          mapfile -d '' -t jf < <(find . -path ./.git -prune -o -name '*.json' -print0)
          if [ "${#jf[@]}" -gt 0 ]; then
            for f in "${jf[@]}"; do python -m json.tool "$f" >/dev/null && echo "ok: $f"; done
          else
            echo "no JSON files"
          fi
