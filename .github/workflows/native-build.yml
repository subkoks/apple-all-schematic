name: Native release candidate

# Build artifacts only. Publishing a tag/release is a separate, manual action.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/python -m pytest -q
      - run: swift test --package-path native/BoardVault --arch x86_64
      - run: ./scripts/build_native_app.sh
      - run: .venv/bin/python scripts/smoke_native_engine.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BoardVault-native-Intel
          path: dist/releases/
          if-no-files-found: error
          retention-days: 7
