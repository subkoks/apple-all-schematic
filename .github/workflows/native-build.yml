name: Native release candidate

# Build artifacts only. Publishing a tag/release is a separate, manual action.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/python -m pytest -q
      - run: swift test --package-path native/BoardVault --arch x86_64
      - run: ./scripts/build_native_app.sh
      - run: .venv/bin/python scripts/smoke_native_engine.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BoardVault-native-Intel
          path: dist/releases/
          if-no-files-found: error
          retention-days: 7
