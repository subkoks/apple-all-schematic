name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Native engine lint
        run: python -m ruff check src/native_engine.py src/native_search.py src/native_organizer.py scripts/package_native_release.py

  swift:
    name: Swift tests (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test --package-path native/BoardVault --arch x86_64

