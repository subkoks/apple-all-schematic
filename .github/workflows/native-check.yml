name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    uses: ./.github/workflows/pr-check.yml

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install locked dev and build dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --extra dev --extra build
      - name: Build with locked setuptools
        run: |
          uv run --no-sync python - <<'PYTHON'
          import tomllib
          from importlib.metadata import version
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = [p["version"] for p in lock["package"] if p["name"] == "setuptools"]
          if len(versions) != 1 or version("setuptools") != versions[0]:
              raise SystemExit("Installed setuptools does not match uv.lock")
          print(f"Verified locked setuptools {versions[0]}")
          PYTHON
          uv build --no-build-isolation --python .venv/bin/python --wheel --out-dir "${RUNNER_TEMP}/boardvault-backend-wheel"
      - run: uv run --no-sync python -m pytest -q
      - name: Native engine lint
        run: uv run --no-sync python -m ruff check src/native_engine.py src/native_search.py src/native_organizer.py scripts/package_native_release.py

  swift:
    name: Swift tests (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test --package-path native/BoardVault --arch x86_64

  sanity:
    name: sanity
    needs: [syntax, python, swift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to pass
        env:
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
        run: |
          test "$SYNTAX_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$SWIFT_RESULT" = success

